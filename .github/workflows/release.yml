name: Release

# Push a tag like v1.0.0 to publish EasyShoot.zip on the Releases page
# (the website's "Download for Mac" button points there).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
      - run: swift test
      - run: UNIVERSAL=1 ./scripts/build-app.sh
      - run: cd build && ditto -c -k --keepParent EasyShoot.app EasyShoot.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: build/EasyShoot.zip
          generate_release_notes: true
