name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build EasyShoot.app (universal)
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Zip app
        run: cd build && ditto -c -k --keepParent EasyShoot.app EasyShoot.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EasyShoot
          path: build/EasyShoot.zip
