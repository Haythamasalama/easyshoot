name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⌥⇧⌘4
        2. Select an area
        3. …
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EasyShoot version
      description: Settings → About.
      placeholder: "1.0.0"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Drag images here. Please remove anything private.
